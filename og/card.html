<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for assets/og-loop.png (the link-preview card). Rendered at 1200x630 by
     .github/workflows/render-og.yml so the real site fonts load. Not linked from the site. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Instrument+Serif:ital@1&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#05080b}
  .bg{position:absolute;inset:0;background:url(../assets/home/hero-film.jpg) 330px 50%/1120px auto no-repeat}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#05080b 0%,#05080b 30%,rgba(5,8,11,.86) 46%,rgba(5,8,11,.25) 66%,rgba(5,8,11,0) 80%),linear-gradient(0deg,rgba(5,8,11,.55),rgba(5,8,11,0) 30%)}
  .copy{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;color:#f2f5f7;font-family:Geist,Inter,sans-serif}
  .brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:30px;letter-spacing:-.01em;margin-bottom:46px}
  .brand img{width:56px;height:auto}
  h1{margin:0;font-weight:600;font-size:66px;line-height:1.02;letter-spacing:-.035em}
  h1 em{display:block;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:78px;letter-spacing:-.01em;color:#bfe6ff;margin-top:6px}
  .pearl{background:linear-gradient(100deg,#fff 0%,#c9d2db 12%,#fff 22%,#bfe6ff 36%,#ffc8e8 50%,#f7fafc 62%,#c4ffe6 76%,#e8eeff 90%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{margin-top:44px;font-size:22px;font-weight:500;color:rgba(242,245,247,.62);letter-spacing:.01em}
  .foot b{color:#2ECEFF;font-weight:500}
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="copy">
    <div class="brand"><img src="../assets/loop-logo.svg" alt="">Loop</div>
    <h1>Your next <span class="pearl">plan</span>,<em>found before you ask.</em></h1>
    <div class="foot">Your personal AI assistant · <b>loopaiapp.com</b></div>
  </div>
</body></html>
