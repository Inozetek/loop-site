<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 320" role="img" aria-label="Loop">
  <!-- Loop mark, H · bluer (Nick 2026-11-18, round 40/41): one diagonal blue-to-green
       gradient across both rings, interlaced like a link (left ring over at the top,
       under at the bottom). Geometry = the app icon's (r 230, gap 134, stroke 56,
       knockout stroke+40) scaled to the previous logo's width. Generator recipe:
       scripts/generate-app-icon.py. -->
  <defs>
    <linearGradient id="loopStroke" gradientUnits="userSpaceOnUse" x1="42.46" y1="45.29" x2="405.54" y2="274.71">
      <stop offset="0" stop-color="#0A9CEB"/>
      <stop offset=".5" stop-color="#30CBD0"/>
      <stop offset="1" stop-color="#0BCB8C"/>
    </linearGradient>
    <clipPath id="loopTop"><rect x="0" y="0" width="448" height="160"/></clipPath>
    <clipPath id="loopBottom"><rect x="0" y="160" width="448" height="160"/></clipPath>
    <mask id="loopUnderRight" maskUnits="userSpaceOnUse" x="0" y="0" width="448" height="320">
      <rect width="448" height="320" fill="#fff"/>
      <circle cx="157.17" cy="160" r="114.71" fill="none" stroke="#000" stroke-width="47.88" clip-path="url(#loopTop)"/>
    </mask>
    <mask id="loopUnderLeft" maskUnits="userSpaceOnUse" x="0" y="0" width="448" height="320">
      <rect width="448" height="320" fill="#fff"/>
      <circle cx="290.83" cy="160" r="114.71" fill="none" stroke="#000" stroke-width="47.88" clip-path="url(#loopBottom)"/>
    </mask>
  </defs>
  <circle cx="157.17" cy="160" r="114.71" fill="none" stroke="url(#loopStroke)" stroke-width="27.93" mask="url(#loopUnderLeft)"/>
  <circle cx="290.83" cy="160" r="114.71" fill="none" stroke="url(#loopStroke)" stroke-width="27.93" mask="url(#loopUnderRight)"/>
</svg>
