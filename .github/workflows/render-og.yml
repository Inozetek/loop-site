name: Render link-preview card

# Renders og/card.html to assets/og-loop.png (1200x630) with the real site fonts,
# which the authoring container cannot reach. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch();
              const p = await b.newPage({ viewport: { width: 1200, height: 630 }, deviceScaleFactor: 1 });
              await p.goto('file://' + process.cwd() + '/og/card.html', { waitUntil: 'networkidle' });
              await p.evaluate(() => document.fonts.ready);
              await p.waitForTimeout(500);
              await p.screenshot({ path: 'assets/og-loop.png' });
              await b.close();
            })();
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/og-loop.png
          git diff --cached --quiet || git commit -m "Link-preview card re-rendered from og/card.html"
          git push
